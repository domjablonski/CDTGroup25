[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foodcom"
version = "0.1.0"
description = "02807 group project on the Food.com recipes and interactions dataset"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "data: needs the real data in data/processed/ (skipped when missing, e.g. in CI)",
    "slow: takes more than ~30 s (deselect with -m 'not slow')",
]
